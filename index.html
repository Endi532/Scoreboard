<html>
    <head>
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div id="game"> 
            <div class="container">
                <div class="team-card">
                    <h3 class="title">HOME</h3>
                    <div class="score">
                        <p id="home-score">0</p>
                    </div>
                    <div class="btn-container">
                        <button onclick="h_add(1)">+1</button>
                        <button onclick="h_add(2)">+2</button>
                        <button onclick="h_add(3)">+3</button>
                    </div>
                </div>

                <div class="team-card">
                    <h3 class="title">AWAY</h3>
                    <div class="score">
                        <p id="guest-score">0</p>
                    </div>
                    <div class="btn-container">
                        <button onclick="g_add(1)">+1</button>
                        <button onclick="g_add(2)">+2</button>
                        <button onclick="g_add(3)">+3</button>
                    </div>
                </div>
            </div>

            <button id="new-game-btn" onclick="newGame()">New Game</button>
            
        </div> 
        <script src="index.js"></script>
    </body>
</html>
